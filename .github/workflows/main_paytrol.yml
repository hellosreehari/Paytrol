# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Paytrol

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, check, test and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # next build (output: 'standalone') produces a self-contained server in
      # .next/standalone; static assets have to be copied in next to it.
      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4E62DCCD254F466B8D77581F8D48C267 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6DF76714941D4C04B9FBF62790F5EBC5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E73F78C3B00149E6B45FA638B05B2D01 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Paytrol'
          slot-name: 'Production'
          package: .
          clean: true
          restart: true
          startup-command: HOSTNAME=0.0.0.0 node server.js

      # Fails the run if the app can't reach its database, photo storage,
      # Gemini or sign-in config. Open /api/health in a browser for details.
      # It first waits until the new build is the one answering: right after a
      # deploy, App Service can keep serving the previous build for a while.
      - name: Health check
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            code=$(curl -s -o health.json -w '%{http_code}' "$APP_URL/api/health" || true)
            version=$(jq -r '.version // empty' health.json 2>/dev/null || true)
            if [ "$version" != "$EXPECTED_VERSION" ]; then
              echo "Attempt $attempt: HTTP $code, still serving ${version:-the previous build}; waiting for $EXPECTED_VERSION..."
              sleep 15
              continue
            fi
            cat health.json
            if [ "$code" = "200" ]; then exit 0; fi
            echo "::error::Health check reported a problem (HTTP $code)"
            exit 1
          done
          echo "::error::The new build did not start serving within 10 minutes"; exit 1
