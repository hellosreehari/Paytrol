apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-migrate
  description: Applies packages/db's migrations to the stage and prod Cloudflare D1 databases
  labels:
    domain: infra
    scope: database
    team: platform
    layer: data

spec:
  type: db-migrate
  lifecycle: production
  owner: platform
  domain: infra

  # Migrations find the database through the wiring document cloudflare-d1
  # publishes after its apply, so on a merge to main this waits for that apply
  # (enforced), and the app waits on this. A pull request applies nothing, so
  # nothing waits there (advisory). `db` is the package this builds and runs.
  dependsOn:
    - component: db
    - component: cloudflare-d1
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request

  path: packages/db/src/migrations

  parameters:
    nodeVersion: "22"
    pnpmVersion: "__PNPM_VERSION__"
    owner: __OWNER__
    repo: __PROJECT__

  # All from orun secrets: a D1 token minted per run (the Cloudflare
  # integration's d1-edit template; workers-deploy cannot touch D1), the
  # account id, and the wiring document that carries the database id.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://__WS__/__PROJECT__/{{ .environment }}/CLOUDFLARE_D1_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://__WS__/__PROJECT__/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    WIRING_CLOUDFLARE_D1: "secret://__WS__/__PROJECT__/{{ .environment }}/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: stage
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
