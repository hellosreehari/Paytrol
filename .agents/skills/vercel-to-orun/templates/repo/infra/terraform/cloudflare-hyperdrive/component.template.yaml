apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-hyperdrive
  description: Provisions Cloudflare Hyperdrive resources for stage and prod Supabase Postgres databases
  labels:
    domain: infra
    scope: runtime-database-gateway

spec:
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra

  # Hyperdrive's origin is the Supabase Postgres connection that `supabase`
  # publishes; it must run after that secret exists.
  dependsOn:
    - component: supabase

  parameters:
    orgName: __OWNER__
    stackName: cloudflare-hyperdrive
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # The wiring document (hyperdrive id/name) is published after the apply; worker deploys read it back as WIRING_CLOUDFLARE_HYPERDRIVE_<ENV>.
    secretOutputs: "WIRING_CLOUDFLARE_HYPERDRIVE=wiring"

  # From orun secrets: a token minted per run from the hyperdrive-edit template
  # (workers-deploy cannot touch Hyperdrive) and the account id. Declared on the
  # component because plan-only lanes refresh against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://__WS__/__PROJECT__/{{ .environment }}/CLOUDFLARE_HYPERDRIVE_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://__WS__/__PROJECT__/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://__WS__/__PROJECT__/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    # Supabase origin, published by the supabase component's secretOutputs.
    TF_VAR_supabase_project_ref: "secret://__WS__/__PROJECT__/{{ .environment }}/SUPABASE_PROJECT_REF"
    TF_VAR_supabase_db_password: "secret://__WS__/__PROJECT__/{{ .environment }}/SUPABASE_DB_PASSWORD"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
