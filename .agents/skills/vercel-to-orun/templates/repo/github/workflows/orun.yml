# Orun CI for __PROJECT__: plan the intent, then run one GitHub job per lane.
# Off until the ORUN_CI repository variable is "true" (set it once the
# workspace secrets exist). The upstream's own CI stays the merge gate.
name: Orun

on:
  push:
    branches: [main]
  pull_request:
  # A manual deploy of named components from main (for example a backend after
  # its deploy key is stored), with nothing changed.
  workflow_dispatch:
    inputs:
      component:
        description: "Component names, comma-separated; empty for every component"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [stage, prod]

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} to {1}', inputs.component || 'every component', inputs.environment) || '' }}

# PR runs share a group per ref and superseded ones are cancelled. Each main
# push gets its own group: GitHub replaces pending runs in a shared group, and
# a replaced main run would never converge.
concurrency:
  group: orun-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write
  # A lane of several jobs posts one check run per job, named by the job's
  # check title, so branch protection sees the same names as before lanes.
  checks: write

jobs:
  plan:
    if: ${{ vars.ORUN_CI == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      lane-matrix: ${{ steps.matrix.outputs.lane-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: __ORUN_VERSION__
      - env:
          # Surface the best-effort catalog auto-sync (execution.state.autopushCatalog).
          # A successful push prints "✓ pushed catalog …"; ORUN_VERBOSE also makes
          # any skip/failure visible instead of silent.
          ORUN_VERBOSE: "1"
          # A manual run's selection, read from the environment, never
          # interpolated into the script.
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run plans under the push-to-main trigger, filtered to
            # the environment and the components it names. Main only.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Orun CI::A manual run deploys main only; this one was started on ${GITHUB_REF}."
              exit 1
            fi
            plan_args=(
              --trigger github-push-main
              --env "$DISPATCH_ENVIRONMENT"
              --intent intent.yaml
              --output plan.json
            )
            IFS=',' read -ra picked <<< "${DISPATCH_COMPONENT:-}"
            for c in "${picked[@]}"; do
              c="${c//[[:space:]]/}"
              [ -z "$c" ] && continue
              if ! [[ "$c" =~ ^[a-z0-9][a-z0-9._-]{0,99}$ ]]; then
                echo "::error title=Orun CI::'$c' is not a component name."
                exit 1
              fi
              plan_args+=(--component "$c")
            done
          else
            # orun reads the base intent.yaml from the base branch by name, and
            # a pull request checkout only has origin/<base>.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git branch --force "$GITHUB_BASE_REF" "origin/$GITHUB_BASE_REF"
            fi
            plan_args=(
              --from-ci github
              --event-file "$GITHUB_EVENT_PATH"
              --intent intent.yaml
              --output plan.json
              --changed
            )
          fi

          orun plan "${plan_args[@]}"
      # One matrix entry per LANE (execution.lanes in intent.yaml). A plan
      # without lanes gets one per job, exactly the old matrix, and
      # `orun run --lane <job id>` on it is `--job <job id>`.
      - id: matrix
        run: |
          echo "lane-matrix=$(jq -c 'if ((.lanes // []) | length) > 0
            then [.lanes[] | {"lane": .id, "name": .name}]
            else [.jobs[] | {"lane": .id, "name": .checkName}] end' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: orun-plan
          path: plan.json

  run:
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      ${{ needs.plan.outputs.lane-matrix != '[]' && needs.plan.outputs.lane-matrix != ''
          }}
    strategy:
      fail-fast: false
      # Stagger the fan-out: every lane resolves its secrets at job start.
      max-parallel: 16
      matrix:
        include: ${{ fromJson(needs.plan.outputs.lane-matrix) }}
    name: ${{ matrix.name }}
    env:
      # One pnpm store for every lane, restored below.
      npm_config_store_dir: /home/runner/.pnpm-store
      PNPM_STORE_DIR: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@v6
      # Keyed by the lockfile alone: every lane shares one entry.
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: orun-plan
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: __ORUN_VERSION__
      # exec-id is the run id alone, so `gh run rerun --failed` resumes the same
      # orun execution: completed jobs stay completed, and --retry re-opens
      # this lane's failed ones.
      - run: |
          # --retry only on re-run attempts; a first attempt fails fast.
          retry_flag=""
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then retry_flag="--retry"; fi
          # Every run reports to the platform, pull requests included: a PR lane
          # resolves its secrets like any other, and without remote state each
          # lane that declares one fails. Nothing mutating runs on a PR (deploy
          # and apply profiles are gated on github-push-main); fork PRs get no
          # OIDC token and fail closed.
          state_flag="--remote-state"
          # --isolation none: a staged job tree links node_modules from outside
          # its root, which Turbopack refuses ("Could not find the Next.js
          # package").
          orun run \
            --plan plan.json \
            --runner github-actions \
            $state_flag \
            --lane "${{ matrix.lane }}" \
            --exec-id "${{ github.run_id }}" \
            --isolation none \
            $retry_flag
        env:
          # GITHUB_TOKEN is the only credential CI holds; every provider
          # credential is an orun-managed secret brokered fresh per run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: /home/runner/.docker
